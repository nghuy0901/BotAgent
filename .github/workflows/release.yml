name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      archive: tar.gz

                    - target: aarch64-unknown-linux-gnu
                      archive: tar.gz

                    - target: x86_64-pc-windows-gnu
                      archive: zip

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install cross
              run: cargo install cross --git https://github.com/cross-rs/cross

            - name: Build
              run: cross build --release --target ${{ matrix.target }}

            - name: Package (Unix)
              if: matrix.archive == 'tar.gz'
              run: |
                  mkdir dist

                  cp target/${{ matrix.target }}/release/sweep dist/

                  tar -czf \
                    sweep-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
                    -C dist sweep

            - name: Package (Windows)
              if: matrix.archive == 'zip'
              run: |
                  mkdir dist

                  cp target/${{ matrix.target }}/release/sweep.exe dist/

                  cd dist
                  zip ../sweep-${{ github.ref_name }}-${{ matrix.target }}.zip sweep.exe

            - name: Upload Release Asset
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      *.tar.gz
                      *.zip
