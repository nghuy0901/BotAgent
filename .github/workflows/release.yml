name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      archive: tar.gz
                      command: cargo

                    - target: aarch64-unknown-linux-gnu
                      archive: tar.gz
                      command: cross

                    - target: x86_64-pc-windows-gnu
                      archive: zip
                      command: cross

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install cross
              if: matrix.command == 'cross'
              uses: taiki-e/install-action@cross

            - name: Build
              run: ${{ matrix.command }} build --release --target ${{ matrix.target }}

            - name: Package (Unix)
              if: matrix.archive == 'tar.gz'
              run: |
                  mkdir dist

                  cp target/${{ matrix.target }}/release/sweep dist/

                  tar -czf \
                    sweep-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
                    -C dist sweep

            - name: Package (Windows)
              if: matrix.archive == 'zip'
              run: |
                  mkdir dist

                  cp target/${{ matrix.target }}/release/sweep.exe dist/

                  cd dist
                  zip ../sweep-${{ github.ref_name }}-${{ matrix.target }}.zip sweep.exe

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.target }}
                  path: |
                      sweep-*.tar.gz
                      sweep-*.zip

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                  merge-multiple: true

            - name: Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      sweep-*.tar.gz
                      sweep-*.zip
