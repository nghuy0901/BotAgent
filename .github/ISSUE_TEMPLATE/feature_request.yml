name: 💡 Feature Request
title: "[feature] "
description: Suggest an idea
labels:
    - "type: feature request"
body:
    - type: markdown
      attributes:
          value: |
              Thank you for suggesting an improvement to Sweep 🙏

              Please describe the feature as clearly as possible and explain the problem it solves.

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What problem are you facing?
          placeholder: |
              Example:
              Sweep currently doesn't have a tool for creating voice channels.
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed Solution
          description: Describe your ideal solution.
          placeholder: |
              Example:
              Add a `channel.create_voice` tool.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives Considered
          description: Are there any alternative solutions or workarounds you've thought about?
          placeholder: |
              Example:
              Using a single `channel.create` tool with an option for channel kind.

    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Attachments
              - Config
              - Context
              - Discord
              - LLM
              - Safety
              - Skills
              - Tools
              - Other
      validations:
          required: true

    - type: dropdown
      id: breaking
      attributes:
          label: Is this a breaking change?
          options:
              - "No"
              - "I'm unsure"
              - "Yes"

    - type: textarea
      id: additional
      attributes:
          label: Additional Context
          description: Screenshots, logs, references, examples, or anything else.
