[package]
name = "sweep"
version = "0.2.0"
edition = "2024"
description = "A Discord bot powered by a local LLM with tool calling & per-channel context"
authors = ["nghuy0901"]
repository = "https://github.com/nghuy0901/BotAgent"

[dependencies]
async-openai = { version = "0.38.0", default-features = false, features = ["chat-completion"] }
chrono = "0.4.44"
dashmap = "6.1.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
parking_lot = "0.12.5"
rand = "0.10.1"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = "0.12.5"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
