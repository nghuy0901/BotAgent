# Sweep Configuration
# Copy this file to sweep.toml and adjust as needed.
# Secrets like discord.token (SWEEP__DISCORD__TOKEN) or llm.api_key (SWEEP__LLM__API_KEY) should be set via environment variables instead.

[discord]
# Your bot token from the Discord developer portal.
token = ""

[llm]
# Base URL of your OpenAI-compatible endpoint.
endpoint = ""

# The model to use.
model = "qwen3.5-9b"

# API key. Only required for cloud providers.
# api_key = ""

# Optional IDs. Only needed for some cloud providers.
# project_id = ""
# org_id = ""

[bot]
# How long (in ms) to debounce channel events before sending events to the LLM.
debounce_ms = 1000

# Whether to show a typing indicator while Sweep is thinking.
# Note: This option just enables a tool for the LLM. Off by default because smaller models get confused by it.
typing_indicator = false
